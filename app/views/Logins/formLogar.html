#{extends 'main.html' /}
#{set title:'Entrar' /}

<div class="container-app container-auth">
    <div class="auth-brand">
        <img src="@{'public/images/logo.png'}" alt="Logo">
        <h1>Bem-vindo de volta</h1>
        <p>Entre com suas credenciais para continuar.</p>
    </div>
    <div class="panel">
        <form action="@{Logins.logar}" class="panel-body">
            <div class="mb-3">
                <label for="floatingLogin" class="form-label">Login</label>
                <input type="text" name="username" class="form-control" id="floatingLogin" placeholder="Informe seu login" required="required">
            </div>
            <div class="mb-4">
                <label for="floatingSenha" class="form-label">Senha</label>
                <input type="password" name="senha" class="form-control" id="floatingSenha" placeholder="Informe sua senha" required="required">
            </div>
            <input type="submit" value="Entrar" class="btn btn-brand w-100 py-2">
        </form>
    </div>
    <p class="text-center text-muted">Não possui conta? <a href="@{Logins.form}" class="fw-semibold">Criar conta</a></p>
</div>
