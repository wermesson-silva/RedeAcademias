#{extends 'main.html' /}
#{set title:'Cadastro de conta' /}

<div class="container-app container-auth">
    <div class="auth-brand">
        <img src="@{'public/images/logo.png'}" alt="Logo">
        <h1>Crie a sua conta</h1>
        <p>Escolha o tipo de acesso e defina sua senha.</p>
    </div>
    <div class="panel">
        <form action="@{Logins.salvar}" class="panel-body">
            <div class="mb-3">
                <label for="floatingLogin" class="form-label">Login</label>
                <input type="text" name="l.login" class="form-control" id="floatingLogin" placeholder="Informe um login" required="required">
            </div>
            <div class="mb-3">
                <label class="form-label">Tipo de conta</label>
                <select name="l.tipo" class="form-select">
                    <option value="CLIENTE">Cliente</option>
                    <option value="PERSONAL">Personal</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="floatingSenha" class="form-label">Senha</label>
                <input type="password" name="l.senha" class="form-control" id="floatingSenha" placeholder="Informe uma senha" required="required">
            </div>
            <div class="mb-4">
                <label for="floatingRepetir" class="form-label">Confirmar senha</label>
                <input type="password" name="l.confirmaSenha" class="form-control" id="floatingRepetir" placeholder="Repita a sua senha" required="required">
            </div>
            <input type="submit" value="Criar conta" class="btn btn-brand w-100 py-2">
        </form>
    </div>
    <p class="text-center text-muted">Já possui conta? <a href="@{Logins.formLogar}" class="fw-semibold">Entrar</a></p>
</div>
