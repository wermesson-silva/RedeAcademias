#{extends 'main.html' /}
#{set title:'Academias' /}

<div class="container-app">
    <div class="page-head">
        <div>
            <p class="eyebrow">Gerenciamento</p>
            <h1>Academias cadastradas</h1>
        </div>
        <div class="d-flex gap-2">
            <a href="@{application.index}" class="btn btn-line">Início</a>
            <a href="@{Academias.form}" class="btn btn-brand"><i class="bi bi-plus-lg"></i> Nova academia</a>
        </div>
    </div>

    <div class="panel">
        <div class="panel-head">
            <form action="@{Academias.listar}" class="search">
                <i class="bi bi-search"></i>
                <input id="termoAcademia" class="form-control" type="text" name="termo" value="${termo}" placeholder="Pesquisar academia"/>
            </form>
        </div>
        <div class="table-responsive">
            <table id="dado" class="table data-table">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Endereço</th>
                        <th>CNPJ</th>
                        <th>Contato</th>
                        <th class="text-center">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    #{list items: academias, as:'a'}
                        <tr>
                            <td data-th="Nome">${a.nome}</td>
                            <td data-th="Endereço">${a.endereco}</td>
                            <td data-th="CNPJ">${a.CNPJ}</td>
                            <td data-th="Contato">${a.contato}</td>
                            <td class="text-center actions" data-th="Ações">
                                <a href="@{Academias.remover(a.id)}" class="icon-btn danger" title="Remover"><i class="bi bi-trash3"></i></a>
                                <a href="@{Academias.editar(a.id)}" class="icon-btn" title="Editar"><i class="bi bi-pencil-square"></i></a>
                                <a href="@{Academias.formPersonal(a.id)}" class="icon-btn" title="Personais"><i class="bi bi-person-plus"></i></a>
                            </td>
                        </tr>
                    #{/list}
                </tbody>
            </table>
        </div>
    </div>
</div>
