#{extends 'main.html' /}
#{if academia}
	#{set title:'Edição de Academia' /}
#{/if}
#{else}
	#{set title:'Cadastro de Academia' /}
#{/else}

<div class="container-app container-narrow">
    <div class="page-head">
        <div>
            <p class="eyebrow">Academias</p>
            <h1>Dados da academia</h1>
        </div>
    </div>
    <form action="@{Academias.salvar}" class="panel">
        <input type="hidden" name="a.id" value="${academia?.id}" />
        <div class="panel-body">
            <div class="mb-3">
                <label for="floatingNome" class="form-label">Nome</label>
                <input type="text" name="a.nome" class="form-control" id="floatingNome" value="${academia?.nome}" placeholder="Digite aqui o nome" required="required">
            </div>
            <div class="mb-3">
                <label for="floatingEndereco" class="form-label">Endereço</label>
                <input type="text" name="a.endereco" class="form-control" id="floatingEndereco" value="${academia?.endereco}" placeholder="Digite aqui o endereço" required="required">
            </div>
            <div class="row g-3">
                <div class="col-sm-6">
                    <label for="cnpj" class="form-label">CNPJ</label>
                    <input type="text" name="a.CNPJ" class="form-control" id="cnpj" value="${academia?.CNPJ}" placeholder="00.000.000/0000-00" required="required">
                </div>
                <div class="col-sm-6">
                    <label for="contato" class="form-label">Contato</label>
                    <input type="text" name="a.contato" class="form-control" id="contato" value="${academia?.contato}" placeholder="(xx) xxxx-xxxx" required="required">
                </div>
            </div>
        </div>
        <div class="panel-foot">
            <input type="submit" value="Salvar" class="btn btn-brand">
            <a href="@{Academias.listar}" class="btn btn-line">Voltar à listagem</a>
        </div>
    </form>
</div>
