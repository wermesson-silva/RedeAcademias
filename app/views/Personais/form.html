#{extends 'main.html' /}
#{if personal}
	#{set title:'Edição de Personal' /}
#{/if}
#{else}
	#{set title:'Cadastro de Personal' /}
#{/else}

<div class="container-app container-narrow">
    <div class="page-head">
        <div>
            <p class="eyebrow">Personais</p>
            <h1>Dados do personal</h1>
        </div>
    </div>
    <form action="@{Personais.salvar}" class="panel">
        <input type="hidden" name="p.id" value="${personal?.id}" />
        <input type="hidden" name="p.conta.id" value="${idConta}" />
        <div class="panel-body">
            <div class="row g-3 mb-3">
                <div class="col-sm-6">
                    <label for="floatingNome" class="form-label">Nome</label>
                    <input type="text" name="p.nome" class="form-control" id="floatingNome" value="${personal?.nome}" placeholder="Digite aqui o nome" required="required">
                </div>
                <div class="col-sm-6">
                    <label for="floatingSobrenome" class="form-label">Sobrenome</label>
                    <input type="text" name="p.sobrenome" class="form-control" id="floatingSobrenome" value="${personal?.sobrenome}" placeholder="Digite aqui o sobrenome" required="required">
                </div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-sm-4">
                    <label for="cpf" class="form-label">CPF</label>
                    <input type="text" name="p.cpf" class="form-control" id="cpf" value="${personal?.cpf}" placeholder="000.000.000-00" required="required">
                </div>
                <div class="col-sm-4">
                    <label for="contato" class="form-label">Contato</label>
                    <input type="text" name="p.contato" class="form-control" id="contato" value="${personal?.contato}" placeholder="(xx) xxxx-xxxx" required="required">
                </div>
                <div class="col-sm-4">
                    <label for="floatingData" class="form-label">Data de nascimento</label>
                    <input type="date" name="p.dataNascimento" class="form-control" id="floatingData" value="${personal?.dataNascimento}" required="required">
                </div>
            </div>
            <div>
                <label for="salario" class="form-label">Salário</label>
                <div class="input-group">
                    <span class="input-group-text">R$</span>
                    <input type="text" name="p.salario" class="form-control" id="salario" value="${personal?.salario}" placeholder="0,00" required="required">
                </div>
            </div>
        </div>
        <div class="panel-foot">
            <input type="submit" value="Salvar" class="btn btn-brand">
            <a href="@{Personais.listar}" class="btn btn-line">Voltar à listagem</a>
        </div>
    </form>
</div>
