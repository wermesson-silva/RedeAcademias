#{extends 'main.html' /}
#{set title:'Personais' /}

<div class="container-app">
    <div class="page-head">
        <div>
            <p class="eyebrow">Gerenciamento</p>
            <h1>Personais cadastrados</h1>
        </div>
        <div class="d-flex gap-2">
            <a href="@{application.index}" class="btn btn-line">Início</a>
            <a href="@{Personais.form}" class="btn btn-brand"><i class="bi bi-plus-lg"></i> Novo personal</a>
        </div>
    </div>

    <div class="panel">
        <div class="panel-head">
            <form class="search">
                <i class="bi bi-search"></i>
                <input id="termoPersonal" class="form-control" type="text" name="termo" value="${termo}" placeholder="Pesquisar personal"/>
            </form>
        </div>
        <div class="table-responsive">
            <table id="dado" class="table data-table">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Sobrenome</th>
                        <th>CPF</th>
                        <th>Contato</th>
                        <th>Idade</th>
                        <th>Salário</th>
                        <th class="text-center">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    #{list items: personais, as:'p'}
                        <tr>
                            <td data-th="Nome">${p.nome}</td>
                            <td data-th="Sobrenome">${p.sobrenome}</td>
                            <td data-th="CPF">${p.cpf}</td>
                            <td data-th="Contato">${p.contato}</td>
                            <td data-th="Idade">${p.idade}</td>
                            <td data-th="Salário">${p.salario}</td>
                            <td class="text-center actions" data-th="Ações">
                                <a href="@{Personais.remover(p.id)}" class="icon-btn danger" title="Remover"><i class="bi bi-trash3"></i></a>
                                <a href="@{Personais.editar(p.id)}" class="icon-btn" title="Editar"><i class="bi bi-pencil-square"></i></a>
                            </td>
                        </tr>
                    #{/list}
                </tbody>
            </table>
        </div>
    </div>
</div>
